name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=review_gate --cov-report=term-missing --cov-fail-under=90

  config:
    name: Validate shipped rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: review-gate validate --config .github/review-gate.yml
      - run: review-gate validate --config examples/review-gate.example.yml

  end-to-end:
    name: End-to-end (mocked model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Classify a sample diff
        run: |
          review-gate evaluate \
            --config tests/fixtures/e2e-config.yml \
            --diff-file tests/fixtures/sample.diff \
            --mock-answers tests/fixtures/mock-answers.json \
            --repo "$GITHUB_REPOSITORY" \
            --output result.json \
            --markdown summary.md

      - name: Assert the expected reviewer set
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("result.json"))
          assert result["schema_version"] == "1.0", result
          assert result["required_reviewers"] == ["devops"], result["required_reviewers"]
          assert result["degraded"] is False, result["errors"]
          fired = [d["rule_id"] for d in result["decisions"] if d["fired"]]
          assert fired == ["lambda-event-contract"], fired
          print("end-to-end OK:", result["required_reviewers"])
          PY

      - name: Run the action itself
        id: gate
        uses: ./
        with:
          config: tests/fixtures/e2e-config.yml
          diff-file: tests/fixtures/sample.diff
          mock-answers: tests/fixtures/mock-answers.json
          output: action-result.json
          markdown: action-summary.md

      - name: Assert the action outputs
        env:
          REVIEWERS: ${{ steps.gate.outputs.required_reviewers_csv }}
          DEGRADED: ${{ steps.gate.outputs.degraded }}
        run: |
          test "$REVIEWERS" = "devops" || { echo "unexpected reviewers: $REVIEWERS"; exit 1; }
          test "$DEGRADED" = "false" || { echo "unexpected degraded: $DEGRADED"; exit 1; }
          test -f action-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: review-gate-sample-output
          path: |
            result.json
            summary.md

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: review-gate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm review-gate:ci --version
          docker run --rm -v "$PWD:/src" -w /src \
            -e REVIEW_GATE_MOCK_ANSWERS=tests/fixtures/mock-answers.json \
            review-gate:ci evaluate \
              --config tests/fixtures/e2e-config.yml \
              --diff-file tests/fixtures/sample.diff \
            | tee /dev/stderr | grep -q '"required_reviewers"'
