[package]
name = "review-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Classify a pull request diff into the reviewer types it actually needs, using TypeSafe AI's Jev model."
license = "MIT"
readme = "README.md"
repository = "https://github.com/czinegeroland/review-gate"

[[bin]]
name = "review-gate"
path = "src/main.rs"

[lib]
name = "review_gate"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json", "tls"], default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
